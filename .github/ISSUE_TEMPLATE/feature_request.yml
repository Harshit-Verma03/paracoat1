name: Feature request
description: Suggest a dispatcher workflow or product improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What dispatcher or warehouse task is difficult today?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe who needs this and when they would use it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
