name: Bug report
description: Report a reproducible problem in Paracoat Dispatch Studio
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include customer data, shipment addresses, credentials, database files, or other sensitive information."
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: v0.1.0 or short commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether you used Docker.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
    validations:
      required: true
